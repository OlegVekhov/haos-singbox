name: sing-box
slug: sing_box
version: 1.14.4-6
description: sing-box with full YAML/JSON configuration in Home Assistant
url: https://github.com/OlegVekhov/haos-singbox
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false
ports:
  1080/tcp: 1080
  1080/udp: null
ports_description:
  1080/tcp: SOCKS5 TCP (choose external port in Network)
  1080/udp: Optional SOCKS5 UDP
options:
  log:
    level: info
  inbounds:
    - type: socks
      tag: keenetic-socks
      listen: "0.0.0.0"
      listen_port: 1080
      users:
        - username: keenetic
          password: CHANGE_THIS_PASSWORD
  outbounds:
    - type: direct
      tag: direct
  route:
    final: direct
schema: false
