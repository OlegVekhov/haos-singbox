name: sing-box
slug: sing_box
version: 1.14.4-8b1
description: sing-box with experimental Keenetic Hev UDP-in-TCP bridge
url: https://github.com/OlegVekhov/haos-singbox
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false
ports:
  1080/tcp: 1080
  1080/udp: null
ports_description:
  1080/tcp: SOCKS5 TCP (choose external port in Network)
  1080/udp: Optional SOCKS5 UDP (legacy mode only)
options:
  hev_udp_bridge: false
  sing_box_config: |
    {
      "log": {"level": "info"},
      "inbounds": [{
        "type": "socks",
        "tag": "keenetic-socks",
        "listen": "0.0.0.0",
        "listen_port": 1080,
        "users": [{"username": "keenetic", "password": "CHANGE_THIS_PASSWORD"}]
      }],
      "outbounds": [{"type": "direct", "tag": "direct"}],
      "route": {"final": "direct"}
    }
schema:
  hev_udp_bridge: bool
  sing_box_config: str
