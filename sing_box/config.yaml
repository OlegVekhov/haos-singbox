name: sing-box
slug: sing_box
version: 1.14.4-7
description: sing-box SOCKS5 with reliable multiline JSON configuration
url: https://github.com/OlegVekhov/haos-singbox
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false
ports:
  1080/tcp: 1080
  1080/udp: null
ports_description:
  1080/tcp: SOCKS5 TCP (choose external port in Network)
  1080/udp: Optional SOCKS5 UDP
options:
  sing_box_config: |
    {
      "log": {"level": "info"},
      "inbounds": [{
        "type": "socks",
        "tag": "keenetic-socks",
        "listen": "0.0.0.0",
        "listen_port": 1080,
        "users": [{"username": "keenetic", "password": "CHANGE_THIS_PASSWORD"}]
      }],
      "outbounds": [{"type": "direct", "tag": "direct"}],
      "route": {"final": "direct"}
    }
schema:
  sing_box_config: str
